# =====================================================================
# BillEasy — development override (hot reload)
#
# Run from the repository root:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Stop:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml down
#
# Wipe containers + volumes (MySQL data, node_modules, .next):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v
#
# What changes vs. the production stack:
#   - every image is built with `target: dev` (dev dependencies included)
#   - source directories are bind-mounted, so edits reload immediately
#     (nodemon for the services, `next dev` for the web app)
#   - nodemon runs with --legacy-watch and Next.js runs webpack with
#     WATCHPACK_POLLING, because Windows/WSL2 bind mounts do not reliably
#     forward filesystem events into the containers
#   - node_modules and .next live in named volumes, so host artifacts never
#     leak into the containers and Windows bind mounts stay fast
#   - the service ports are published for direct debugging
#
# After changing a service's package.json, rebuild and recreate its
# node_modules volume, e.g.:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#     build auth-service && docker volume rm billeasy_auth-service-node_modules
# =====================================================================

x-dev-service: &dev-service
  build:
    target: dev
  environment:
    NODE_ENV: development
    # Windows/WSL2 bind mounts do not reliably forward inotify events,
    # so nodemon polls for changes instead.
    CHOKIDAR_USEPOLLING: "true"
  command: ["npm", "run", "dev", "--", "--legacy-watch"]

services:
  # -------------------------------------------------------------------
  # Microservices — nodemon watching the bind-mounted source
  # -------------------------------------------------------------------
  auth-service:
    <<: *dev-service
    volumes:
      - ./services/auth-service:/app
      - auth-service-node_modules:/app/node_modules
    ports:
      - "4001:4001"

  account-service:
    <<: *dev-service
    volumes:
      - ./services/account-service:/app
      - account-service-node_modules:/app/node_modules
    ports:
      - "4002:4002"

  product-service:
    <<: *dev-service
    volumes:
      - ./services/product-service:/app
      - product-service-node_modules:/app/node_modules
    ports:
      - "4003:4003"

  bill-service:
    <<: *dev-service
    volumes:
      - ./services/bill-service:/app
      - bill-service-node_modules:/app/node_modules
    ports:
      - "4004:4004"

  staff-service:
    <<: *dev-service
    volumes:
      - ./services/staff-service:/app
      - staff-service-node_modules:/app/node_modules
    ports:
      - "4005:4005"

  # -------------------------------------------------------------------
  # API gateway — nodemon watching the bind-mounted source
  # -------------------------------------------------------------------
  gateway:
    <<: *dev-service
    volumes:
      - ./services/gateway-service:/app
      - gateway-service-node_modules:/app/node_modules

  # -------------------------------------------------------------------
  # Next.js web app — `next dev`, source bind-mounted for fast refresh
  # -------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      args:
        # Only used by production builds; kept so the merge stays explicit.
        GATEWAY_URL: http://gateway:4000
    environment:
      NODE_ENV: development
      GATEWAY_URL: http://gateway:4000
      JWT_SECRET: ${JWT_SECRET:-billeasy-super-secret-key-2026}
      CHOKIDAR_USEPOLLING: "true"
      # Watchpack polls because file events are unreliable across the
      # Windows bind mount; --webpack is required for polling to apply
      # (Turbopack is the Next.js 16 default but does not use watchpack).
      WATCHPACK_POLLING: "true"
    command: ["npm", "run", "dev", "--", "--webpack", "--hostname", "0.0.0.0"]
    volumes:
      - ./frontend:/app
      - frontend-node_modules:/app/node_modules
      - frontend-next:/app/.next

volumes:
  auth-service-node_modules:
  account-service-node_modules:
  product-service-node_modules:
  bill-service-node_modules:
  staff-service-node_modules:
  gateway-service-node_modules:
  frontend-node_modules:
  frontend-next:
